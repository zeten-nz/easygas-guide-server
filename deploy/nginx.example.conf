# EASY GAS — Nginx EXAMPLE (recommended baseline: SAME-ORIGIN)
# ============================================================
#
# SAFE ARTIFACT: template only. No secrets or real hostnames. Replace every
# <PLACEHOLDER>, obtain real TLS certificates, and review with ops/security.
#
# RECOMMENDED TOPOLOGY (this file): a SINGLE public origin over HTTPS that:
#   - serves the built SPA (client `dist/`) as static files, and
#   - reverse-proxies "/api" to the PRIVATE Node app (default 127.0.0.1:4000),
#     preserving the backend's "/api/v1" paths.
# Because the SPA and the API share one origin, cookies are first-party and CORS
# is not exercised in normal use. The Vite dev proxy (client/vite.config.ts) is a
# DEVELOPMENT convenience only and is NOT part of the production build — do not
# run `vite dev`/`vite preview` as the production server; build (`npm run build`)
# and let Nginx serve `dist/`.
#
# Roles of Nginx here:
#   - Terminate TLS at the edge; be the SINGLE trusted proxy hop (app has
#     TRUST_PROXY_HOPS=1). Safe ONLY when ALL public traffic passes through this
#     one Nginx AND the Node port is NOT publicly reachable (firewall note below).
#   - Serve static assets with correct caching; SPA-fallback client routes to
#     index.html; NEVER fall an /api error back to index.html.
#   - Keep the metrics endpoint OFF the public origin.
# ---------------------------------------------------------------------------

# Private Node app. Keep bound to localhost / the private network — never public.
upstream easygas_api {
    server 127.0.0.1:4000;   # env.PORT (default 4000). One dedicated API app.
    keepalive 32;
}

# --- HTTP :80 → ACME challenge + redirect everything to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name <PUBLIC_DOMAIN>;   # e.g. app.example.com  (NO real value here)

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS :443 → serve SPA + proxy /api ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <PUBLIC_DOMAIN>;

    # ---- TLS (PLACEHOLDERS — supply real certs out of band) ----
    ssl_certificate     <PATH_TO_FULLCHAIN_PEM>;   # e.g. /etc/letsencrypt/live/<domain>/fullchain.pem
    ssl_certificate_key <PATH_TO_PRIVKEY_PEM>;     # e.g. /etc/letsencrypt/live/<domain>/privkey.pem
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS: opt in only once every subdomain is HTTPS-only.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Built SPA. Copy the client build here on deploy: `npm run build` in the
    # client repo produces `dist/` (index.html + hashed assets under /assets/).
    root <CLIENT_DIST_DIR>;   # e.g. /srv/easygas/client/dist
    index index.html;

    # Evidence uploads (signature + step photos) are capped at ~5MB/file in the
    # app (multer). Allow a little multipart headroom. Do NOT raise this large.
    client_max_body_size 6m;

    # The app already sets security headers via Helmet (src/app.ts) on API
    # responses. TLS/HSTS is Nginx's job; do not duplicate app headers here.

    # ---- Metrics must NEVER be public ----
    # The app exposes GET /api/v1/metrics (token-gated, opt-in). Even so, keep it
    # OFF the public origin. Exact-match wins over the /api/ prefix below.
    location = /api/v1/metrics { return 404; }

    # ---- API → private backend (preserve the /api/v1 path) ----
    # URI-less proxy_pass (no trailing slash/path) forwards the ORIGINAL request
    # URI unchanged, so /api/v1/... reaches the backend as /api/v1/... . This
    # location does NOT have a try_files SPA fallback, so an API 404/4xx/5xx
    # returns the API's own response — it never falls back to index.html.
    location /api/ {
        proxy_pass http://easygas_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";    # keepalive to upstream

        # Read timeout comfortably above the app's 25s graceful-shutdown window
        # so in-flight requests can finish draining.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_request_buffering on;
    }

    # ---- Hashed, content-addressed assets → cache hard ----
    # Vite emits immutable, fingerprinted files under /assets/. Safe to cache for
    # a year; a new build gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;   # a missing hashed asset is a 404, not index.html
        access_log off;
    }

    # ---- SPA: serve static file if present, else index.html (client routing) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must NOT be cached hard, or clients pin an old bundle that
    # references deleted hashed assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";   # revalidate every load
    }

    # ---- Readiness / active health checks (be honest) ----
    # GET /api/v1/ready returns 200 when ready, 503 while draining or when a
    # dependency (DB/Redis/storage) is down; GET /api/v1/health is liveness only.
    # Nginx OSS has NO active upstream health checks — these comments do NOT add
    # one. To actively drain an unhealthy node you must use ONE of:
    #   (a) Nginx Plus:  health_check uri=/api/v1/ready match=...;
    #   (b) an external monitor / LB that polls /api/v1/ready and pulls the node
    #       from rotation on non-200 (recommended for multi-node);
    #   (c) passive proxy_next_upstream + max_fails (coarse, single-node has no peer).
}

# ===========================================================================
# FIREWALL / NETWORK (enforce OUTSIDE Nginx):
#   - The Node port (4000) MUST be firewalled to localhost / the private network
#     (e.g. bind Node to 127.0.0.1, or `ufw deny 4000/tcp`). If clients can reach
#     Node directly they bypass TLS, Nginx and the single-proxy-hop assumption and
#     can spoof X-Forwarded-For (corrupting audit logs / rate-limit keys).
#   - The OPTIONAL SMS worker's private port (default 4001) must NEVER be in this
#     upstream or exposed.
#   - Only 80/443 should be publicly reachable on this host.
# ===========================================================================
#
# ALTERNATIVE: SEPARATE-ORIGIN (SPA and API on different hosts) — use only if you
# cannot co-locate. It requires ALL of the following to AGREE, or auth/CSRF break:
#   - Client build: set VITE_API_URL to the API origin, e.g.
#         VITE_API_URL=https://api.example.com/api/v1
#     (the default is "/api/v1", i.e. same-origin — this file's baseline).
#   - App: CLIENT_ORIGIN=https://app.example.com (the SPA origin) so CORS allows it
#     and the CSRF origin check passes.
#   - Cookies: the session cookie is host-only + SameSite; cross-site XHR needs
#     credentials and a CORS policy that returns the exact CLIENT_ORIGIN with
#     Access-Control-Allow-Credentials — verify this end to end before relying on it.
#   - Two Nginx server blocks (one per origin): the API vhost proxies "/" to the
#     backend (still blocking /api/v1/metrics); the SPA vhost serves dist/ with the
#     SPA fallback above. Do NOT invent a domain or change DNS here.
