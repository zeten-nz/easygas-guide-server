# EASY GAS — Nginx reverse-proxy EXAMPLE (Phase 10F artifact)
# ============================================================
#
# SAFE ARTIFACT: template only. It deploys nothing and contains NO secrets or
# real hostnames. Replace every <PLACEHOLDER> before use, obtain real TLS
# certificates, and review with your ops/security owner.
#
# Role of Nginx in this system (see docs/PRODUCTION-RUNTIME-10C.md):
#   - Terminate TLS (HTTPS) at the edge.
#   - Reverse-proxy to the PRIVATE Node port (default 4000, env.PORT).
#   - Health-check GET /api/v1/ready and route traffic ONLY while it returns
#     200 (it flips to 503 during graceful shutdown so this instance drains).
#   - Be the SINGLE trusted proxy hop. The app is configured with
#     TRUST_PROXY_HOPS=1, which is safe ONLY when ALL public traffic passes
#     through exactly this one Nginx AND the Node port is NOT publicly
#     reachable (see the firewall note at the bottom).
#
# ---------------------------------------------------------------------------

# Upstream = the private Node app. Keep this bound to localhost / the private
# network. It must NOT be exposed to the internet (firewall note below).
upstream easygas_api {
    server 127.0.0.1:4000;   # env.PORT (default 4000). One dedicated API app.
    keepalive 32;
}

# --- HTTP :80 → redirect everything to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <PUBLIC_DOMAIN>;   # e.g. api.example.com  (NO real value here)

    # Allow ACME HTTP-01 challenges if you use certbot, then redirect the rest.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 → reverse proxy to the Node app ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <PUBLIC_DOMAIN>;

    # ---- TLS termination (PLACEHOLDERS — supply real certs out of band) ----
    ssl_certificate     <PATH_TO_FULLCHAIN_PEM>;   # e.g. /etc/letsencrypt/live/<domain>/fullchain.pem
    ssl_certificate_key <PATH_TO_PRIVKEY_PEM>;     # e.g. /etc/letsencrypt/live/<domain>/privkey.pem
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS: opt in only once you are certain every subdomain is HTTPS-only.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Upload size ----
    # Evidence uploads: customer signature + step photos, capped at ~5MB per
    # file in the app (multer fileSize 5 * 1024 * 1024). Allow a little headroom
    # for multipart overhead. Do NOT raise this large — it is an abuse surface.
    client_max_body_size 6m;

    # ---- Security headers ----
    # The application already sets security headers via Helmet (see src/app.ts).
    # Do NOT duplicate/override them here unless you have a specific reason;
    # conflicting headers cause subtle bugs. TLS + HSTS (above) is Nginx's job.

    # ---- Proxy headers: give the app the REAL client IP and scheme ----
    # TRUST_PROXY_HOPS=1 in the app means it trusts exactly ONE X-Forwarded-For
    # hop — THIS proxy. It must match exactly one real proxy hop: if there is a
    # CDN/load balancer in front of this Nginx too, that is TWO hops and you
    # must raise TRUST_PROXY_HOPS to match, or clients could spoof their IP via
    # X-Forwarded-For (which would corrupt audit logs and rate-limit keys).
    location / {
        proxy_pass http://easygas_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keepalive to the upstream.
        proxy_set_header Connection "";

        # Timeouts: keep the read timeout comfortably ABOVE the app's 25s
        # graceful-shutdown window so in-flight requests can finish draining.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Do not buffer indefinitely; tune to your evidence upload sizes.
        proxy_request_buffering on;
    }

    # ---- Health check / readiness note ----
    # GET /api/v1/ready returns 200 when ready, 503 while draining or when a
    # dependency (DB/Redis/storage/SMS-config) is down. Nginx OSS has no active
    # upstream health checks; use ONE of:
    #   (a) Nginx Plus:  health_check uri=/api/v1/ready match=...;
    #   (b) an external monitor / load balancer that polls /api/v1/ready and
    #       pulls this node from rotation on non-200;
    #   (c) passive failover with proxy_next_upstream + max_fails (coarse).
    # GET /api/v1/health is liveness only (no dependency checks) — use /ready
    # for routing decisions.

    # ---- Metrics must NOT be public ----
    # If a metrics endpoint (e.g. /api/v1/metrics) is ever enabled, it MUST NOT
    # be exposed publicly — it can leak operational internals. Either do not
    # proxy it, or restrict it to your monitoring network. Example hard block:
    #   location = /api/v1/metrics { return 404; }
    # (Uncomment/adjust only if such an endpoint exists in your build.)
}

# ===========================================================================
# FIREWALL / NETWORK (enforce OUTSIDE Nginx — comments only):
#   - The Node port (4000) MUST be firewalled to localhost / the private
#     network. If clients can reach Node directly, they bypass TLS, Nginx, and
#     the single-proxy-hop assumption, and can spoof X-Forwarded-For.
#     e.g. ufw:  ufw deny 4000/tcp   (or bind Node to 127.0.0.1 only)
#   - Only 80/443 should be publicly reachable on this host.
#   - The dedicated SMS worker's (unused) HTTP listener must likewise never be
#     placed in this upstream or exposed.
# ===========================================================================
