# EASY GAS full-stack browser E2E (Phase 10F) — CROSS-REPO, PUBLIC repos.
#
# Mirror of the client repo's e2e-fullstack.yml. Both repos are PUBLIC, so the
# client checkout is a tokenless, read-only, shallow HTTPS clone — NO secret/PAT.
#
# Symmetric strategy: a SERVER pull request tests the server PR branch against
# client `main`. No repository_dispatch → no cross-repo trigger loop. Runs on
# pull_request (blocking) + push to main + manual dispatch (optional refs).
name: e2e-fullstack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_ref:
        description: "Client ref to test (default: main)"
        required: false
        default: main
      server_ref:
        description: "Server ref to test (default: this ref)"
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-fullstack-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT_REPO_URL: https://github.com/zeten-nz/easygas-guide.git
  CLIENT_REF: ${{ github.event.inputs.client_ref || 'main' }}

jobs:
  fullstack:
    name: browser E2E (server PR × client main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_throwaway_root
          MYSQL_DATABASE: easygas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_throwaway_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci_only_throwaway_root
      DB_NAME: easygas
      TEST_DB_NAME: easygas_test
      REDIS_URL: redis://127.0.0.1:6379
      CLIENT_ORIGIN: http://localhost:5173
      TRUST_PROXY_HOPS: "0"
      E2E_API_PORT: "4000"
    steps:
      - name: Checkout server (this repo)
        uses: actions/checkout@v4.2.2
        with:
          path: server
          persist-credentials: false
      - name: Clone client (public, tokenless, read-only)
        run: git clone --depth 1 --branch "$CLIENT_REF" "$CLIENT_REPO_URL" client
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Generate a throwaway APP_KEY
        run: echo "APP_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build
      - name: Install client deps + Playwright Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fail if zero specs are discovered
        working-directory: client
        run: |
          COUNT=$(npx playwright test --list 2>/dev/null | grep -c '›' || true)
          echo "discovered $COUNT tests"
          if [ "$COUNT" -eq 0 ]; then echo "::error::no Playwright tests discovered"; exit 1; fi
      - name: Run full-stack Playwright (client webServer starts ../server harness + Vite)
        working-directory: client
        run: npm run test:e2e
      - name: Assert every spec ran (no skips, non-empty)
        if: always()
        working-directory: client
        run: node scripts/assert-e2e-complete.mjs test-results.json
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: playwright-report-server-pr
          path: client/playwright-report
          retention-days: 7
